<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 640px;
    }
    h1 {
      margin: 0 0 .25rem;
      font-size: 2.5rem;
      letter-spacing: -0.02em;
    }
    p.lead {
      margin: 0 0 2.5rem;
      color: var(--muted);
      font-size: 1.1rem;
    }
    .card {
      display: block;
      padding: 1.5rem 1.75rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      transition: border-color .15s ease, transform .15s ease;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card h2 {
      margin: 0 0 .35rem;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .card h2 .arrow { color: var(--accent); transition: transform .15s ease; }
    .card:hover h2 .arrow { transform: translateX(4px); }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
    }
    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: .85rem;
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Jarvis</h1>
    <p class="lead">A quiet place for daily logs and notes.</p>

    <a class="card" href="logs.html">
      <h2>Logs <span class="arrow">&rarr;</span></h2>
      <p>Daily maintenance run log &mdash; per-task status and output, newest first.</p>
    </a>

    <footer>
      Published with GitHub Pages &middot;
      <a href="https://github.com/marek-smerak/JarvisPages">source</a>
    </footer>
  </main>
</body>
</html>
